<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper — панель нарезок</title>
<style>
:root{--bg:#0e1013;--panel:#171a1f;--panel2:#1e2228;--line:#2a2f37;--text:#e8eaed;--mute:#8b93a1;
--accent:#b8f04a;--accent-ink:#11140a;--warn:#ffb454;--bad:#ff6b6b;--good:#5fd38d;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
a.btn{color:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:16px;margin:0;letter-spacing:.02em}
h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px}
main{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.projects{display:flex;flex-direction:column;gap:6px;overflow:auto}
.proj{padding:9px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--panel2)}
.proj.active{border-color:var(--accent)}
.proj b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.proj small,.mute{color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--mute)}
.pill.good{color:var(--good);border-color:var(--good)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.work{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(260px,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1250px){.work{grid-template-columns:1fr 1fr}.work .pv{grid-column:1/-1}}
@media(max-width:800px){.app{grid-template-columns:1fr}.work{grid-template-columns:1fr}}
.moment{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
.moment.active{border-color:var(--accent)}
.moment .top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.score{font-weight:700;color:var(--accent);min-width:38px}
.moment input[type=text]{font-weight:600}
.hooks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--mute);border:1px solid transparent;background:none}
.tab.active{color:var(--text);border-color:var(--line);background:var(--panel2)}
.preview{aspect-ratio:9/16;width:100%;background:#000;border-radius:8px;overflow:hidden;position:relative}
.preview img{width:100%;height:100%;object-fit:contain;display:block}
.preview .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.clip video{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px}
.clip b{display:block;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.status.error{border-color:var(--bad);color:var(--bad)}
.check{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.check input{accent-color:var(--accent)}
.empty{color:var(--mute);padding:30px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile b{font-size:26px;display:block}
.stages{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px}
@media(max-width:1200px){.stages{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.stages{grid-template-columns:1fr}}
.stage{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.stage h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.asset{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;word-break:break-all}
.asset img{width:100%;height:90px;object-fit:contain;display:block;margin-bottom:6px}
.ref{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-bottom:14px}
.ref img{width:100%;border-radius:8px}
@media(max-width:800px){.ref{grid-template-columns:1fr}}

/* --- оформление 2: навигация, диалоги, подсказки --- */
:root{--bg:#0b0d10;--panel:#14171c;--panel2:#1b1f26;--line:#262b34;--mute:#8d96a5;--r:12px}
body{font-size:14px;-webkit-font-smoothing:antialiased}
aside{gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
main{padding:22px 26px;gap:18px;max-width:1500px}
h1{font-size:19px;font-weight:650;letter-spacing:0}
main>div:first-child>.mute{margin-top:4px;max-width:900px}
.card{padding:16px 18px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.btn{transition:border-color .12s,background .12s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary:hover{background:#c8f76a;border-color:#c8f76a}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:12px 8px 4px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:7px 10px;color:var(--mute);cursor:pointer}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent);font-weight:600}
nav .badge{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-weight:700}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,94vw);max-height:92vh}
dialog#picker2{width:min(1000px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.45);white-space:pre-wrap}
.toast.bad{border-left-color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:11px;font-weight:700}
.step.done{color:var(--text)}.step.done i{background:var(--good);color:#06210f}
.step.now{color:var(--text);border-color:var(--accent)}.step.now i{background:var(--accent);color:var(--accent-ink)}
.status{display:flex;align-items:center;gap:10px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{border-color:var(--text);outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:6px 8px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
#pickStage{position:relative;user-select:none;touch-action:none;line-height:0;overflow:hidden;border-radius:8px;cursor:crosshair}
#pickImg{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#pickBox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;border-radius:4px}
.welcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.welcome .card b{display:block;margin-bottom:4px}
.moment,.proj,.stage{transition:border-color .12s}
.moment:hover,.proj:hover{border-color:var(--mute)}
@media(max-width:800px){aside{position:static;height:auto}}
dialog#modal{width:min(1080px,96vw)}
dialog#modal.narrow{width:min(620px,96vw)}
.design{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:800px){.design{grid-template-columns:1fr}}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.mrow input[type=text]{flex:1;min-width:0;background:transparent;border-color:transparent;font-weight:600;padding:5px 6px}
.mrow input[type=text]:hover,.mrow input[type=text]:focus{border-color:var(--line);background:var(--panel)}
.mrow .score{min-width:44px}
.clips{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.clip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.clip video{border-radius:0;display:block}
.clip .body{padding:10px 12px 12px}
.clip .badge2{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:1px 9px;font-weight:700;font-size:12px}
.clip .row{gap:4px}.clip .row .btn{padding:4px 2px;font-size:11.5px}.clip .row .btn:last-child{flex:0 0 28px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.bar .field{margin:0;flex:1;min-width:150px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* --- оформление 3: система по образцу Linear (awesome-design-md) + правила движения (design-motion-principles) --- */
:root{--bg:#08090b;--panel:#101216;--panel2:#16191f;--panel3:#1d2128;--line:#23272f;--line2:#2f343d;
--text:#f7f8f8;--text2:#d0d6e0;--mute:#8a8f98;--faint:#62666d;--accent:#b8f04a;--accent-hi:#cdf77a;
--ease:cubic-bezier(.2,.8,.2,1);--r:12px}
body{font-family:Inter,"SF Pro Text","SF Pro Display",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}
h1{font-size:20px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
main>div:first-child h1{font-size:24px;letter-spacing:-.6px}
h2{font-size:12px;font-weight:500;letter-spacing:.4px;color:var(--mute)}
aside{background:var(--panel);border-right:1px solid var(--line)}
.card,.stage,.clip,.mrow,.moment,.proj,.asset,dialog,.toast{border-color:var(--line)}
.card{background:var(--panel);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.stage,.mrow,.clip,.moment,.asset{background:var(--panel2)}
.mute,.field label,.kv span:first-child{color:var(--mute)}
.btn{border-radius:8px;padding:7px 14px;font-weight:500;background:var(--panel2);border-color:var(--line);transition:background .14s var(--ease),border-color .14s var(--ease),color .14s var(--ease)}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.small{padding:4px 10px;border-radius:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn:active{transform:translateY(1px)}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border-color:var(--line);border-radius:8px;padding:8px 12px;transition:border-color .14s var(--ease)}
input[type=text]:hover,input[type=number]:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid rgba(184,240,74,.5);outline-offset:1px}
.pill{border-radius:9999px;border-color:var(--line2);color:var(--text2);font-size:11px;padding:1px 9px}
.tab{border-radius:8px;transition:background .14s var(--ease),color .14s var(--ease)}
.tab:hover{color:var(--text)}
nav button{border-radius:0 8px 8px 0;transition:background .14s var(--ease),color .14s var(--ease)}
.seg{border-radius:8px;border-color:var(--line);background:var(--panel2)}
.seg button{transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:hover{color:var(--text)}
.status{background:var(--panel);border-color:var(--line);border-radius:10px}
.step{border-color:var(--line)}
.clip{border-radius:12px}.mrow{border-radius:10px}
.moment:hover,.proj:hover,.mrow:hover{border-color:var(--line2)}
.tile b{font-size:28px;font-weight:600;letter-spacing:-.8px}
.score{letter-spacing:-.2px}
dialog{border-radius:16px;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
dialog[open]{animation:dlg .16s var(--ease)}
dialog[open]::backdrop{animation:fade .16s var(--ease)}
.toast{animation:toast .18s var(--ease);background:var(--panel3)}
#main{animation:fade .14s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* --- оформление 4: проход по правилам unslop — решения приняты один раз, здесь --- */
:root{--accent:#a9dc5a;--accent-hi:#bde67c}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h2{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text2)}
nav .grp{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--faint)}
nav button,nav button.active{border-left:0;border-radius:8px;padding-left:12px}
nav button.active{background:var(--panel3)}
.toast,.toast.bad{border-left:1px solid var(--line2)}
.toast.bad{border-color:var(--bad)}
dialog .card{background:transparent;border:0;padding:0;box-shadow:none}
.card .stage,.card .asset{background:transparent}
.score,.tile b,.badge2,.kv span:last-child,.mrow .mute{font-variant-numeric:tabular-nums}
.score{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:6px;background:var(--panel3);color:var(--text);font-weight:600;font-size:12px}
.mrow .score{min-width:34px}
.clip .badge2{border-color:var(--line2);color:var(--text);background:rgba(8,9,11,.78)}
.step.done i{background:var(--panel3);color:var(--text2)}
.pill.good{color:var(--good);border-color:var(--line2)}
.pill.warn{color:var(--warn);border-color:var(--line2)}
.pill.bad{color:var(--bad);border-color:var(--line2)}
.btn.small.primary{font-weight:600}
.section{padding:0}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i></i><h1>Clipper</h1></div>
    <button class="btn primary" id="openNew" style="width:100%">+ Новый исходник</button>
    <nav id="nav"></nav>
    <h2 style="margin:6px 0 0">Проекты</h2>
    <div class="projects" id="projects"></div>
  </aside>
  <main id="main"><div class="empty">Загружаю…</div></main>
</div>
<dialog id="newSource">
  <div class="dlg-head"><h1>Новый исходник</h1><button class="btn small" id="closeNew" aria-label="Закрыть">×</button></div>
  <p class="mute" style="margin:0 0 12px">Ссылка на видео или стрим, путь к файлу на этом компьютере или загрузка файла. Панель расшифрует речь и найдёт сильные моменты.</p>
      <div class="field"><label>Ссылка или путь к файлу</label><input type="text" id="src" placeholder="https://… или /Users/…/video.mp4"></div>
      <div class="field"><label>Или загрузить файл</label><input type="file" id="file" accept="video/*"></div>
      <div class="field"><label>Сколько роликов</label><div class="seg" id="segCount"></div></div>
      <div class="field"><label>Длина ролика</label><div class="seg" id="segLen"></div></div>
      <div class="field"><label>Что искать</label>
        <select id="focus"><option value="">Всё сильное</option><option value="смешное, приколы, мемы">Смешное и мемы</option><option value="фейлы, провалы, неудачи">Фейлы</option><option value="яркие эмоции, крики, реакции">Эмоции и реакции</option><option value="конфликты, споры, ругань">Конфликты</option><option value="красивая игра, скилл, клатчи">Игровые моменты</option><option value="сильные мысли, цитаты, истории">Мысли и истории</option></select></div>
      <div class="field"><label>Что сделать после анализа</label><select id="autoPreset"></select></div>
      <details style="margin-bottom:12px"><summary class="mute" style="cursor:pointer">Дополнительно</summary><div style="margin-top:10px">
      <div class="row">
        <div class="field"><label>Роликов</label><input type="number" id="count" value="10" min="1" max="50"></div>
        <div class="field"><label>От, с</label><input type="number" id="min" value="20" min="5"></div>
        <div class="field"><label>До, с</label><input type="number" id="max" value="45" min="10"></div>
      </div>
      <div class="field"><label>Кто выбирает моменты</label><select id="picker"></select></div>
      <div class="field"><label>Распознавание речи</label>
        <select id="whisper"><option value="small">Быстрое (small)</option><option value="medium">Точнее (medium)</option><option value="large-v3">Лучшее (large-v3)</option><option value="off">Выключить</option></select></div>
      <div class="field"><label>Стример (для его материалов)</label><input type="text" id="streamer" list="owners" placeholder="например evelone"><datalist id="owners"></datalist></div>
      <div class="field"><label>Залипалка для сплита (путь, необязательно)</label><input type="text" id="filler" placeholder="/Users/…/loop.mp4"></div>
      </div></details>
  <button class="btn primary" id="add" style="width:100%">Найти моменты</button>
</dialog>
<dialog id="modal"><div class="dlg-head"><h1 id="modalTitle"></h1><button class="btn small" id="modalClose" aria-label="Закрыть">×</button></div><div id="modalBody"></div></dialog>
<dialog id="picker2">
  <div class="dlg-head"><h1 id="pickTitle">Выделите область</h1><button class="btn small" id="pickClose" aria-label="Закрыть">×</button></div>
  <p class="mute" id="pickHint" style="margin:0 0 10px"></p>
  <div id="pickStage"><img id="pickImg" alt="Кадр исходника" draggable="false"><div id="pickBox"></div></div>
  <div class="row" style="margin-top:12px"><span class="mute" id="pickInfo"></span><button class="btn primary" id="pickOk" style="flex:none">Применить</button></div>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
