<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper — панель нарезок</title>
<style>
:root{--bg:#0e1013;--panel:#171a1f;--panel2:#1e2228;--line:#2a2f37;--text:#e8eaed;--mute:#8b93a1;
--accent:#b8f04a;--accent-ink:#11140a;--warn:#ffb454;--bad:#ff6b6b;--good:#5fd38d;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
a.btn{color:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:16px;margin:0;letter-spacing:.02em}
h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px}
main{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.projects{display:flex;flex-direction:column;gap:6px;overflow:auto}
.proj{padding:9px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--panel2)}
.proj.active{border-color:var(--accent)}
.proj b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.proj small,.mute{color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--mute)}
.pill.good{color:var(--good);border-color:var(--good)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.work{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(260px,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1250px){.work{grid-template-columns:1fr 1fr}.work .pv{grid-column:1/-1}}
@media(max-width:800px){.app{grid-template-columns:1fr}.work{grid-template-columns:1fr}}
.moment{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
.moment.active{border-color:var(--accent)}
.moment .top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.score{font-weight:700;color:var(--accent);min-width:38px}
.moment input[type=text]{font-weight:600}
.hooks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--mute);border:1px solid transparent;background:none}
.tab.active{color:var(--text);border-color:var(--line);background:var(--panel2)}
.preview{aspect-ratio:9/16;width:100%;background:#000;border-radius:8px;overflow:hidden;position:relative}
.preview img{width:100%;height:100%;object-fit:contain;display:block}
.preview .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.clip video{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px}
.clip b{display:block;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.status.error{border-color:var(--bad);color:var(--bad)}
.check{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.check input{accent-color:var(--accent)}
.empty{color:var(--mute);padding:30px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i></i><h1>Clipper</h1></div>
    <div class="card">
      <h2>Новый исходник</h2>
      <div class="field"><label>Ссылка или путь к файлу</label><input type="text" id="src" placeholder="https://… или /Users/…/video.mp4"></div>
      <div class="field"><label>Или загрузить файл</label><input type="file" id="file" accept="video/*"></div>
      <div class="row">
        <div class="field"><label>Роликов</label><input type="number" id="count" value="8" min="1" max="40"></div>
        <div class="field"><label>От, с</label><input type="number" id="min" value="20" min="5"></div>
        <div class="field"><label>До, с</label><input type="number" id="max" value="60" min="10"></div>
      </div>
      <div class="field"><label>Кто выбирает моменты</label><select id="picker"></select></div>
      <div class="field"><label>Распознавание речи</label>
        <select id="whisper"><option value="small">Быстрое (small)</option><option value="medium">Точнее (medium)</option><option value="large-v3">Лучшее (large-v3)</option><option value="off">Выключить</option></select></div>
      <div class="field"><label>Залипалка для сплита (путь, необязательно)</label><input type="text" id="filler" placeholder="/Users/…/loop.mp4"></div>
      <button class="btn primary" id="add" style="width:100%">Найти моменты</button>
    </div>
    <h2 style="margin:0">Проекты</h2>
    <div class="projects" id="projects"></div>
  </aside>
  <main id="main"><div class="empty">Добавьте исходник слева — ссылку или файл.</div></main>
</div>
<script>
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ''); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
async function api(path, method = 'GET', body) {
  const r = await fetch(path, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
  return r;
}
const PICKERS = {auto: 'Авто (лучший доступный)', claude: 'Claude API (кредиты)', 'claude-cli': 'Claude по подписке', ollama: 'Локальная нейросеть (Ollama)', heuristic: 'Без нейросети'};
const STATUS = {queued: 'в очереди', download: 'скачивание', transcribe: 'расшифровка', scenes: 'сцены', moments: 'поиск моментов', render: 'монтаж', ready: 'готов', error: 'ошибка'};
const TABS = {
  'Раскладка': [
    ['layout', 'Раскладка', 'select', {center: 'Видео по центру', square: 'Квадрат', split: 'Сплит с залипалкой', reaction: 'Вебка + игра'}],
    ['content_zoom', 'Масштаб контента', 'range', [1, 1.6, 0.01]],
    ['background_blur', 'Размытие фона', 'range', [0, 60, 1]],
    ['split_share', 'Доля ролика в сплите', 'range', [0.3, 0.7, 0.01]],
    ['webcam_position', 'Вебка', 'select', {top: 'Сверху', bottom: 'Снизу'}],
    ['webcam_share', 'Высота вебки', 'range', [0.2, 0.6, 0.01]],
    ['webcam.0', 'Вебка в исходнике: слева', 'range', [0, 1, 0.01]],
    ['webcam.1', 'Вебка в исходнике: сверху', 'range', [0, 1, 0.01]],
    ['webcam.2', 'Вебка в исходнике: ширина', 'range', [0.05, 1, 0.01]],
    ['webcam.3', 'Вебка в исходнике: высота', 'range', [0.05, 1, 0.01]],
  ],
  'Хук': [
    ['title', 'Показывать надпись-хук', 'bool'],
    ['title_size', 'Размер', 'range', [30, 120, 1]],
    ['title_y', 'Положение по высоте', 'range', [0.03, 0.95, 0.01]],
    ['title_color', 'Цвет', 'color'],
    ['title_glow', 'Неоновое свечение (цвет RRGGBB, пусто — без него)', 'text'],
    ['title_anim', 'Появление с увеличением', 'bool'],
  ],
  'Субтитры': [
    ['subtitles', 'Показывать субтитры', 'bool'],
    ['subtitle_size', 'Размер', 'range', [30, 130, 1]],
    ['subtitle_y', 'Положение по высоте', 'range', [0.05, 0.97, 0.01]],
    ['subtitle_words', 'Слов на экране', 'range', [1, 6, 1]],
    ['subtitle_upper', 'ЗАГЛАВНЫМИ', 'bool'],
    ['subtitle_pop', 'Слова «выпрыгивают»', 'bool'],
    ['subtitle_color', 'Цвет текста', 'color'],
    ['subtitle_highlight', 'Цвет текущего слова', 'color'],
    ['font', 'Шрифт (имя в системе)', 'text'],
  ],
  'Уникализация': [
    ['mirror', 'Отзеркалить', 'bool'],
    ['speed', 'Скорость', 'range', [0.9, 1.15, 0.01]],
    ['brightness', 'Яркость', 'range', [-0.15, 0.15, 0.01]],
    ['contrast', 'Контраст', 'range', [0.8, 1.3, 0.01]],
    ['saturation', 'Насыщенность', 'range', [0.6, 1.6, 0.01]],
    ['border', 'Рамка, пикс.', 'range', [0, 30, 1]],
    ['border_color', 'Цвет рамки', 'color'],
    ['watermark', 'Ник поверх кадра', 'text'],
    ['watermark_y', 'Ник: положение по высоте', 'range', [0.05, 0.97, 0.01]],
    ['banner', 'Баннер или водяной знак (путь к png)', 'text'],
    ['banner_y', 'Баннер: положение по высоте', 'range', [0.05, 0.95, 0.01]],
    ['banner_width', 'Баннер: ширина', 'range', [0.1, 1, 0.01]],
  ],
};
const SUB_STYLES = {
  'Классика': {subtitle_color: 'FFFFFF', subtitle_highlight: 'FFE600', subtitle_upper: false, subtitle_words: 3, subtitle_size: 72},
  'Капс': {subtitle_color: 'FFFFFF', subtitle_highlight: '4AF0B8', subtitle_upper: true, subtitle_words: 2, subtitle_size: 84},
  'По слову': {subtitle_color: 'FFE600', subtitle_highlight: 'FFFFFF', subtitle_upper: true, subtitle_words: 1, subtitle_size: 100},
  'Спокойные': {subtitle_color: 'E8EAED', subtitle_highlight: 'FF8AD8', subtitle_upper: false, subtitle_words: 4, subtitle_size: 58},
};
let S = {projects: {}, presets: [], pickers: []}, cur = null, mom = 0, tab = 'Раскладка', preset = null, picked = new Set(), at = 0.5, pvTimer = null, pvSeq = 0;

const getP = k => k.includes('.') ? preset[k.split('.')[0]][+k.split('.')[1]] : preset[k];
function setP(k, v) { if (k.includes('.')) { const [a, i] = k.split('.'); preset[a][+i] = v; } else preset[k] = v; queuePreview(); }

function control([key, label, type, opt]) {
  const v = getP(key);
  if (type === 'bool') return h('label', {class: 'check'}, h('input', {type: 'checkbox', checked: !!v, onchange: e => setP(key, e.target.checked)}), label);
  let input, out = h('span', {}, type === 'range' ? v : '');
  if (type === 'select') { input = h('select', {onchange: e => setP(key, e.target.value)}, Object.entries(opt).map(([val, name]) => h('option', {value: val, selected: val === v}, name))); }
  else if (type === 'range') { input = h('input', {type: 'range', min: opt[0], max: opt[1], step: opt[2], value: v, oninput: e => { out.textContent = e.target.value; setP(key, +e.target.value); }}); }
  else if (type === 'color') { input = h('input', {type: 'color', value: '#' + v, oninput: e => setP(key, e.target.value.slice(1).toUpperCase())}); }
  else { input = h('input', {type: 'text', value: v || '', onchange: e => setP(key, e.target.value.trim() || (['banner', 'title_glow'].includes(key) ? null : ''))}); }
  return h('div', {class: 'field'}, h('label', {}, label, out), input);
}

function queuePreview() { clearTimeout(pvTimer); pvTimer = setTimeout(loadPreview, 250); }
async function loadPreview() {
  const p = S.projects[cur], img = $('#pvimg'), hint = $('#pvhint');
  if (!p || !p.moments.length || !p.video || !img) return;
  const seq = ++pvSeq;
  try {
    const r = await api('/api/preview', 'POST', {project: cur, moment: mom, preset, at});
    const url = URL.createObjectURL(await r.blob());
    if (seq !== pvSeq) return;
    img.src = url; img.hidden = false; hint.hidden = true;
  } catch (e) { if (seq === pvSeq) { hint.hidden = false; hint.textContent = 'Предпросмотр не получился: ' + e.message; img.hidden = true; } }
}

function renderProjects() {
  const box = $('#projects'); box.replaceChildren();
  const list = Object.values(S.projects).sort((a, b) => b.created - a.created);
  if (!list.length) box.append(h('div', {class: 'mute'}, 'Пока пусто'));
  for (const p of list) box.append(h('div', {class: 'proj' + (p.id === cur ? ' active' : ''), onclick: () => { cur = p.id; mom = 0; picked = new Set(); renderAll(); }},
    h('b', {}, p.title), h('small', {}, STATUS[p.status] || p.status, ' · моментов ', p.moments.length, ' · роликов ', (p.clips || []).length)));
}

function momentCard(p, m, i) {
  const save = body => api(`/api/projects/${p.id}/moments/${i}`, 'PATCH', body).then(() => { Object.assign(m, body); queuePreview(); }).catch(e => alert(e.message));
  const cuts = (p.scenes || []).filter(t => t > m.start && t < m.end).length;
  return h('div', {class: 'moment' + (i === mom ? ' active' : ''), onclick: e => { if (e.target.closest('input,button')) return; mom = i; renderMain(); }},
    h('div', {class: 'top'},
      h('input', {type: 'checkbox', checked: picked.has(i), title: 'Выбрать для монтажа', onchange: e => { e.target.checked ? picked.add(i) : picked.delete(i); updateRenderBtn(); }}),
      h('span', {class: 'score'}, '★' + m.score),
      h('span', {class: 'mute'}, `${(m.end - m.start).toFixed(0)} с · склеек ${cuts}`),
      m.profanity && h('span', {class: 'pill warn'}, 'мат')),
    h('input', {type: 'text', value: m.title, placeholder: 'Надпись-хук', onchange: e => save({title: e.target.value})}),
    (m.hooks || []).length ? h('div', {class: 'hooks'}, m.hooks.map(x => h('button', {class: 'btn small', title: 'Поставить этот хук', onclick: () => save({title: x}).then(renderMain)}, x))) : null,
    h('div', {class: 'row', style: 'margin-top:6px'},
      h('input', {type: 'number', step: '0.1', value: m.start, title: 'Начало, с', onchange: e => save({start: +e.target.value})}),
      h('input', {type: 'number', step: '0.1', value: m.end, title: 'Конец, с', onchange: e => save({end: +e.target.value})})),
    m.reason && h('div', {class: 'mute', style: 'margin-top:6px'}, m.reason));
}

function updateRenderBtn() { const b = $('#renderBtn'); if (b) { b.textContent = picked.size ? `Смонтировать выбранные (${picked.size})` : 'Смонтировать все'; } }

function renderMain() {
  const main = $('#main'), p = S.projects[cur];
  if (!p) { main.replaceChildren(h('div', {class: 'empty'}, 'Добавьте исходник слева — ссылку или файл.')); return; }
  const busy = !['ready', 'error'].includes(p.status);
  const head = h('div', {class: 'row'},
    h('div', {}, h('h1', {}, p.title), h('div', {class: 'mute'}, p.duration ? `${Math.round(p.duration / 60)} мин · ${p.width}×${p.height}` : p.source, p.picker ? ` · моменты выбрал: ${PICKERS[p.picker] || p.picker}` : '')),
    h('div', {style: 'flex:none'}, h('button', {class: 'btn', onclick: async () => { if (confirm('Удалить проект из списка? Файлы роликов останутся на диске.')) { await api('/api/projects/' + p.id, 'DELETE'); cur = null; refresh(); } }}, 'Удалить проект')));
  const status = h('div', {class: 'status' + (p.status === 'error' ? ' error' : '')}, (STATUS[p.status] || p.status) + ': ' + (p.message || ''), p.warning ? ' · ' + p.warning : '');

  const moments = h('div', {class: 'card'}, h('h2', {}, 'Моменты'),
    p.moments.length ? p.moments.map((m, i) => momentCard(p, m, i)) : h('div', {class: 'mute'}, busy ? 'Идёт анализ…' : 'Моментов нет'),
    h('button', {class: 'btn small', disabled: !p.video, onclick: async () => { const s = +prompt('Начало момента, секунды', '0'); const e = +prompt('Конец момента, секунды', String(s + 30)); if (e > s) { await api(`/api/projects/${p.id}/moments`, 'POST', {start: s, end: e, title: ''}); refresh(); } }}, '+ Свой момент'));

  const editor = h('div', {class: 'card'}, h('h2', {}, 'Оформление'),
    h('div', {class: 'row', style: 'margin-bottom:10px'},
      h('select', {onchange: e => { preset = structuredClone(S.presets.find(x => x.name === e.target.value)); renderMain(); }}, S.presets.map(x => h('option', {value: x.name, selected: x.name === preset.name}, x.name))),
      h('button', {class: 'btn', style: 'flex:none', onclick: async () => { const name = prompt('Название пресета', preset.name); if (!name) return; const r = await (await api('/api/presets', 'POST', {...preset, name})).json(); preset.name = r.name; await refresh(); }}, 'Сохранить')),
    h('div', {class: 'tabs'}, Object.keys(TABS).map(t => h('button', {class: 'tab' + (t === tab ? ' active' : ''), onclick: () => { tab = t; renderMain(); }}, t))),
    tab === 'Субтитры' && h('div', {class: 'hooks', style: 'margin-bottom:10px'}, Object.entries(SUB_STYLES).map(([n, st]) => h('button', {class: 'btn small', onclick: () => { Object.assign(preset, st); renderMain(); }}, n))),
    tab === 'Уникализация' && h('button', {class: 'btn', style: 'margin-bottom:10px', onclick: async () => { preset = await (await api('/api/presets/random', 'POST', preset)).json(); renderMain(); }}, 'Рандом'),
    TABS[tab].map(control));

  const pv = h('div', {class: 'card pv'}, h('h2', {}, 'Предпросмотр'),
    h('div', {class: 'preview'}, h('img', {id: 'pvimg', hidden: true, alt: 'Кадр ролика'}), h('div', {class: 'hint', id: 'pvhint'}, p.moments.length ? 'Загружаю кадр…' : 'Появится, когда найдутся моменты')),
    h('div', {class: 'field', style: 'margin-top:8px'}, h('label', {}, 'Момент ролика'), h('input', {type: 'range', min: 0, max: 0.98, step: 0.02, value: at, oninput: e => { at = +e.target.value; queuePreview(); }})),
    h('button', {class: 'btn primary', id: 'renderBtn', style: 'width:100%', disabled: busy || !p.moments.length, onclick: async () => {
      const list = picked.size ? [...picked] : p.moments.map((_, i) => i);
      try { await api('/api/render', 'POST', {project: p.id, moments: list, preset}); refresh(); } catch (e) { alert(e.message); } }}, 'Смонтировать все'),
    h('button', {class: 'btn', style: 'width:100%;margin-top:8px', disabled: busy || !p.moments.length, title: 'Создать проект CapCut с этим моментом, хуком и субтитрами', onclick: async () => {
      try { const r = await (await api('/api/capcut', 'POST', {project: p.id, moment: mom, preset})).json();
        alert(r.capcut_found ? 'Черновик создан — откройте CapCut, он появится в списке проектов.' : 'CapCut на этом компьютере не найден. Черновик сохранён в папку:\n' + r.path); } catch (e) { alert(e.message); } }}, 'Открыть момент в CapCut'));

  const clips = h('div', {class: 'card'}, h('h2', {}, `Готовые ролики (${(p.clips || []).length})`),
    (p.clips || []).length ? h('div', {class: 'clips'}, p.clips.map(c => h('div', {class: 'clip'},
      h('video', {src: `/clips/${p.id}/${encodeURIComponent(c.file)}`, controls: true, preload: 'metadata'}),
      h('b', {title: c.title}, c.title || 'Без названия'),
      h('div', {class: 'mute'}, '★' + c.score, ' · ', c.preset, c.profanity ? ' · мат' : ''),
      c.check && h('div', {}, h('span', {class: 'pill ' + (c.check.percent >= 60 ? 'good' : c.check.percent >= 30 ? 'warn' : 'bad')}, `уникальность ${c.check.percent}%`), ' ', h('span', {class: 'mute'}, c.check.verdict)),
      h('div', {class: 'row', style: 'margin-top:6px'},
        h('button', {class: 'btn small', onclick: async e => { e.target.disabled = true; try { await api(`/api/check/${p.id}/${encodeURIComponent(c.file)}`, 'POST'); } catch (er) { alert(er.message); } refresh(); }}, 'Проверить'),
        h('a', {class: 'btn small', href: `/clips/${p.id}/${encodeURIComponent(c.file)}`, download: c.file, style: 'text-align:center;text-decoration:none'}, 'Скачать'),
        h('button', {class: 'btn small', onclick: async () => { if (confirm('Удалить ролик с диска?')) { await api(`/api/clips/${p.id}/${encodeURIComponent(c.file)}`, 'DELETE'); refresh(); } }}, 'Удалить'))))) : h('div', {class: 'mute'}, 'Пока нет — выберите моменты и нажмите «Смонтировать».'));

  main.replaceChildren(head, status, h('div', {class: 'work'}, moments, editor, pv), clips);
  updateRenderBtn(); queuePreview();
}

function renderAll() { renderProjects(); renderMain(); }
let lastSig = '';
async function refresh() {
  S = await (await api('/api/state')).json();
  if (!preset) preset = structuredClone(S.presets[0] || S.defaults);
  if (!$('#picker').options.length) $('#picker').append(...['auto', ...S.pickers].map(k => h('option', {value: k}, PICKERS[k] || k)));
  if (!cur || !S.projects[cur]) cur = Object.values(S.projects).sort((a, b) => b.created - a.created)[0]?.id || null;
  const sig = JSON.stringify([S.projects, S.presets.map(p => p.name), cur]);
  if (sig !== lastSig && !document.activeElement.matches('main input, main select')) { lastSig = sig; renderAll(); }
}
$('#add').onclick = async () => {
  const btn = $('#add'); btn.disabled = true;
  try {
    let source = $('#src').value.trim(); const f = $('#file').files[0];
    if (f) { btn.textContent = 'Загружаю файл…'; source = (await (await fetch('/api/upload?name=' + encodeURIComponent(f.name), {method: 'PUT', body: f})).json()).path; }
    if (!source) throw new Error('Укажите ссылку, путь или выберите файл');
    const r = await (await api('/api/projects', 'POST', {source, picker: $('#picker').value, count: +$('#count').value, min: +$('#min').value, max: +$('#max').value, whisper: $('#whisper').value, filler: $('#filler').value})).json();
    cur = r.id; mom = 0; picked = new Set(); $('#src').value = ''; $('#file').value = ''; await refresh();
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = 'Найти моменты';
};
refresh(); setInterval(refresh, 2000);
</script>
